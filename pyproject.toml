[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-sequencer"
version = "0.1.0"
description = "Replay saved NextSeq FASTQ runs for transfer testing"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
synthetic-sequencer = "synthetic_sequencer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
