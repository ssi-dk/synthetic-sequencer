name: Release producer image

on:
  push:
    tags: ['test-producer-image-*']
  workflow_dispatch:
    inputs:
      candidate:
        description: Tested producer image prerelease to promote to its application version
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: x86_64, platform: linux/amd64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64, platform: linux/arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test, build and export native image
        env:
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          PYTHONPATH=src python3 -m unittest discover -s tests -v
          bash scripts/package-image.sh "$RUNNER_TEMP/images"
      - uses: actions/upload-artifact@v4
        with:
          name: producer-${{ matrix.arch }}
          path: ${{ runner.temp }}/images/*
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: producer-*
          merge-multiple: true
          path: images
      - name: Publish both architectures under the candidate tag
        working-directory: images
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          sha256sum --check synthetic-sequencer-linux-{x86_64,aarch64}.tar.gz.sha256
          gh release create "$TAG" --verify-tag --prerelease --title "$TAG" \
            --notes 'Docker image archives for Linux x86_64 and aarch64, with checksums and build manifests.' ./*

  promote:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate }}
          persist-credentials: false
      - name: Publish the exact tested bytes as a versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          [[ "$CANDIDATE" =~ ^test-producer-image-[a-zA-Z0-9._-]+$ ]]
          gh release view "$CANDIDATE" --json isDraft,isPrerelease | jq -e '.isPrerelease and (.isDraft | not)'
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          revision=$(git rev-parse HEAD)
          mkdir "$RUNNER_TEMP/promotion"
          cd "$RUNNER_TEMP/promotion"
          assets=()
          for arch in x86_64 aarch64; do
            platform=linux/amd64
            if [[ "$arch" == aarch64 ]]; then platform=linux/arm64; fi
            archive="synthetic-sequencer-linux-$arch.tar.gz"
            gh release download "$CANDIDATE" -p "$archive" -p "$archive.sha256" -p "$archive.manifest.json"
            digest=$(sha256sum "$archive" | cut -d' ' -f1)
            [[ "$(cat "$archive.sha256")" == "$digest  $archive" ]]
            jq -e --arg sha "$revision" --arg version "$version" --arg digest "$digest" \
              --arg platform "$platform" --arg repo "$GH_REPO" --arg archive "$archive" \
              '.kind == "synthetic-sequencer" and .platform == $platform and .version == $version and
               .source_revision == $sha and .publication.repository == $repo and .archive == $archive and
               .archive_sha256 == $digest' "$archive.manifest.json"
            assets+=("$archive" "$archive.sha256" "$archive.manifest.json")
          done
          if git -C "$GITHUB_WORKSPACE" ls-remote --exit-code origin "refs/tags/v$version"; then
            echo "Version tag v$version already exists" >&2
            exit 1
          fi
          gh release create "v$version" --target "$revision" --title "Synthetic Sequencer $version" \
            --notes "Promoted from the tested $CANDIDATE release." "${assets[@]}"
